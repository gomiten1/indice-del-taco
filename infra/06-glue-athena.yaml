            - { Name: precio_mayoreo_kg, Type: "decimal(10,2)" }
            - { Name: brecha_menudeo_pct, Type: "decimal(8,2)" }
            - { Name: brecha_mayoreo_pct, Type: "decimal(8,2)" }
            - { Name: aproximado, Type: boolean }
            - { Name: diagnostico, Type: string }
          Location: !Sub ["s3://${B}/comparativo_proveedor/", { B: !ImportValue { "Fn::Sub": "${ProjectName}-${Environment}-gold-bucket-name" } }]
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

