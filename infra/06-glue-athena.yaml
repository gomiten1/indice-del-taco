AWSTemplateFormatVersion: "2010-09-09"
Description: Catalogo de Glue (DDL manual, sin crawlers) y Athena para consultar silver, cuarentena y gold.

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: "^[a-z0-9-]{3,30}$"
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  BytesScannedCutoff:
    Type: Number
    Default: 104857600
    Description: Tope de bytes escaneados por consulta en el workgroup (100 MB). Athena cobra por dato escaneado

Resources:
  Database:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Sub "indice_taco_${Environment}"
        Description: Indice del Taco - silver, cuarentena y gold

  ResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-athena-results-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: caducar-resultados
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment

  WorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${ProjectName}-${Environment}"
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: !Ref BytesScannedCutoff
        EngineVersion:
          SelectedEngineVersion: "Athena engine version 3"
        ResultConfiguration:
          OutputLocation: !Sub "s3://${ResultsBucket}/resultados/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment

  SilverPrecioProveedor:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref Database
      TableInput:
        Name: silver_precio_proveedor
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          "parquet.compression": SNAPPY
          "projection.enabled": "true"
          "projection.anio.type": "integer"
          "projection.anio.range": "2024,2035"
          "projection.semana_iso.type": "integer"
          "projection.semana_iso.range": "1,53"
          "projection.semana_iso.digits": "2"
          "storage.location.template": !Sub ["s3://${B}/silver_precio_proveedor/anio=${!anio}/semana_iso=${!semana_iso}/", { B: !ImportValue { "Fn::Sub": "${ProjectName}-${Environment}-silver-bucket-name" } }]
        PartitionKeys:
          - { Name: anio, Type: int }
          - { Name: semana_iso, Type: int }
        StorageDescriptor:
          Columns:
            - { Name: fecha_hora, Type: timestamp }
            - { Name: producto, Type: string }
            - { Name: precio_unitario, Type: "decimal(10,2)" }
            - { Name: unidad, Type: string }
            - { Name: tipo_registro, Type: string }
            - { Name: sospechoso, Type: boolean }
            - { Name: archivo_origen, Type: string }
            - { Name: linea, Type: int }
            - { Name: fecha_ingesta, Type: date }
          Location: !Sub ["s3://${B}/silver_precio_proveedor/", { B: !ImportValue { "Fn::Sub": "${ProjectName}-${Environment}-silver-bucket-name" } }]
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

  SilverPrecioMercado:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref Database
      TableInput:
        Name: silver_precio_mercado
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          "parquet.compression": SNAPPY
          "projection.enabled": "true"
          "projection.anio.type": "integer"
          "projection.anio.range": "2024,2035"
          "projection.semana_iso.type": "integer"
          "projection.semana_iso.range": "1,53"
          "projection.semana_iso.digits": "2"
          "storage.location.template": !Sub ["s3://${B}/silver_precio_mercado/anio=${!anio}/semana_iso=${!semana_iso}/", { B: !ImportValue { "Fn::Sub": "${ProjectName}-${Environment}-silver-bucket-name" } }]
        PartitionKeys:
          - { Name: anio, Type: int }
          - { Name: semana_iso, Type: int }
        StorageDescriptor:
          Columns:
            - { Name: fecha_registro, Type: date }
            - { Name: producto_original, Type: string }
            - { Name: insumo, Type: string }
            - { Name: equivalencia, Type: string }
            - { Name: presentacion, Type: string }
            - { Name: marca, Type: string }
            - { Name: precio, Type: "decimal(10,2)" }
            - { Name: precio_kg, Type: "decimal(10,2)" }
            - { Name: unidad, Type: string }
            - { Name: canal, Type: string }
            - { Name: cadena_comercial, Type: string }
            - { Name: nombre_comercial, Type: string }
            - { Name: direccion, Type: string }
            - { Name: municipio, Type: string }
            - { Name: archivo_origen, Type: string }
            - { Name: fecha_ingesta, Type: date }
          Location: !Sub ["s3://${B}/silver_precio_mercado/", { B: !ImportValue { "Fn::Sub": "${ProjectName}-${Environment}-silver-bucket-name" } }]
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

  SilverInpc:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref Database
      TableInput:
        Name: silver_inpc
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          "parquet.compression": SNAPPY
          "projection.enabled": "true"
          "projection.anio.type": "integer"
          "projection.anio.range": "1969,2035"
          "storage.location.template": !Sub ["s3://${B}/silver_inpc/anio=${!anio}/", { B: !ImportValue { "Fn::Sub": "${ProjectName}-${Environment}-silver-bucket-name" } }]
        PartitionKeys:
          - { Name: anio, Type: int }
        StorageDescriptor:
          Columns:
            - { Name: serie_id, Type: string }
            - { Name: fecha, Type: date }
            - { Name: indice, Type: "decimal(12,6)" }
            - { Name: fecha_ingesta, Type: date }
          Location: !Sub ["s3://${B}/silver_inpc/", { B: !ImportValue { "Fn::Sub": "${ProjectName}-${Environment}-silver-bucket-name" } }]
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

  SilverReceta:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref Database
      TableInput:
        Name: silver_receta
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          "parquet.compression": SNAPPY
        StorageDescriptor:
          Columns:
            - { Name: tipo_taco, Type: string }
            - { Name: insumo, Type: string }
            - { Name: gramos_por_taco, Type: int }
            - { Name: vigente_desde, Type: date }
          Location: !Sub ["s3://${B}/silver_receta/", { B: !ImportValue { "Fn::Sub": "${ProjectName}-${Environment}-silver-bucket-name" } }]
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

  Cuarentena:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref Database
      TableInput:
        Name: cuarentena
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          "parquet.compression": SNAPPY
        StorageDescriptor:
          Columns:
            - { Name: fuente, Type: string }
            - { Name: regla, Type: string }
            - { Name: motivo, Type: string }
            - { Name: registro_original, Type: string }
            - { Name: archivo_origen, Type: string }
            - { Name: linea, Type: int }
            - { Name: ejecucion_id, Type: string }
            - { Name: fecha_ingesta, Type: date }
          Location: !Sub ["s3://${B}/", { B: !ImportValue { "Fn::Sub": "${ProjectName}-${Environment}-quarantine-bucket-name" } }]
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

  GoldCostoTacoSemanal:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref Database
      TableInput:
        Name: costo_taco_semanal
        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          "parquet.compression": SNAPPY
        StorageDescriptor:
          Columns:
            - { Name: anio, Type: int }
            - { Name: semana_iso, Type: int }
            - { Name: semana_inicio, Type: date }
            - { Name: tipo_taco, Type: string }
            - { Name: costo_taco_mxn, Type: "decimal(8,2)" }
            - { Name: indice_base100, Type: "decimal(8,2)" }
            - { Name: semana_base, Type: date }
            - { Name: incluye_merma, Type: boolean }
            - { Name: insumos_con_dato, Type: int }
          Location: !Sub ["s3://${B}/costo_taco_semanal/", { B: !ImportValue { "Fn::Sub": "${ProjectName}-${Environment}-gold-bucket-name" } }]
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

