        TableType: EXTERNAL_TABLE
        Parameters:
          classification: parquet
          "parquet.compression": SNAPPY
        StorageDescriptor:
          Columns:
            - { Name: anio, Type: int }
            - { Name: semana_iso, Type: int }
            - { Name: insumo, Type: string }
            - { Name: fuente, Type: string }
            - { Name: precio, Type: "decimal(10,2)" }
            - { Name: unidad, Type: string }
            - { Name: n_observaciones, Type: int }
            - { Name: estadistico, Type: string }
          Location: !Sub ["s3://${B}/precio_insumo_semanal/", { B: !ImportValue { "Fn::Sub": "${ProjectName}-${Environment}-gold-bucket-name" } }]
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
