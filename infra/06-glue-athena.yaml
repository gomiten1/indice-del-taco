            - { Name: tipo_taco, Type: string }
            - { Name: indice_taco_base100, Type: "decimal(8,2)" }
            - { Name: inpc_general_base100, Type: "decimal(8,2)" }
            - { Name: inpc_alimentos_base100, Type: "decimal(8,2)" }
            - { Name: inpc_pecuarios_base100, Type: "decimal(8,2)" }
            - { Name: base_mes, Type: date }
            - { Name: brecha_pp, Type: "decimal(8,2)" }
          Location: !Sub ["s3://${B}/comparativo_inflacion/", { B: !ImportValue { "Fn::Sub": "${ProjectName}-${Environment}-gold-bucket-name" } }]
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe

