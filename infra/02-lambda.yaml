AWSTemplateFormatVersion: "2010-09-09"
Description: Lambda de extraccion que escribe en la capa bronze (rol de minimo privilegio).

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: "^[a-z0-9-]{3,30}$"
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

Resources:
  ExtractFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-extract-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Permite escribir logs en CloudWatch
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: escribir-en-bronze
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                # Solo puede escribir bajo el prefijo raw/ del bucket bronze
                Resource: !Sub
                  - "${BucketArn}/raw/*"
                  - BucketArn: !ImportValue
                      Fn::Sub: "${ProjectName}-${Environment}-bronze-bucket-arn"

  ExtractFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-extract"
      RetentionInDays: 14

  ExtractFunction:
    Type: AWS::Lambda::Function
    DependsOn: ExtractFunctionLogGroup
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-extract"
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt ExtractFunctionRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          BRONZE_BUCKET: !ImportValue
            Fn::Sub: "${ProjectName}-${Environment}-bronze-bucket-name"
      # Codigo en linea solo para el ejercicio de clase.
      # En el proyecto real: codigo en src/ + `aws cloudformation package` (ver README).
      Code:
        ZipFile: |
          import json
          import os
          from datetime import datetime, timezone

          import boto3

          s3 = boto3.client("s3")
          BUCKET = os.environ["BRONZE_BUCKET"]


          def handler(event, context):
              now = datetime.now(timezone.utc)
              key = f"raw/demo/{now:%Y/%m/%d}/{now:%H%M%S}.json"
              payload = {"extracted_at": now.isoformat(), "source": "demo", "event": event}
              s3.put_object(
                  Bucket=BUCKET,
                  Key=key,
                  Body=json.dumps(payload).encode("utf-8"),
                  ContentType="application/json",
              )
              return {"bucket": BUCKET, "key": key}
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: environment
          Value: !Ref Environment

Outputs:
  ExtractFunctionName:
    Value: !Ref ExtractFunction
  ExtractFunctionArn:
    Value: !GetAtt ExtractFunction.Arn
